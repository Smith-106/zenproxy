# =============================================================================
# zenproxy —— 挂在「已经跑着的 new-api」旁边的出口层   ★ 双副本零空窗部署
# =============================================================================
#
# 为什么是两个服务（zenproxy-a / zenproxy-b）：
#   部署史上最顽固的报错族是「容器重建的 1-3 秒空窗」：new-api 对着
#   http://zenproxy:9000 的每个在途请求吃 connection refused，pi 重试烧满重试
#   预算后把 503/auth_unavailable 抛给用户（04:18/04:24/04:26/04:28 四次突发
#   与四次部署逐一对齐）。两个副本共享 DNS 名 zenproxy（networks aliases），
#   滚动重建时永远有一个在健康服务，空窗从物理上消失。
#
# 部署流程（在仓库根目录，编译不再发生在服务器上）：
#   CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
#     -tags netgo,osusergo -ldflags="-s -w" -o out/zenproxy-linux ./cmd/zenproxy
#   scp out/zenproxy-linux <host>:/home/ubuntu/zenproxy-src/out/
#   ssh <host> 'cd /home/ubuntu/zenproxy-src &&
#               docker build -q -f deploy/Dockerfile.slim -t zenproxy:latest . &&
#               /usr/local/bin/zenproxy-rolling.sh'   ← 见 deploy/rolling-deploy.sh
#
# 状态：两个副本都以读写挂 ./data。出口健康写成各自的
#   exits-state-<hostname>.json，避免后写覆盖把另一边刚记下的退役和准入抹掉。
#   旧的共享 exits-state.json 只在本副本还没有自己的文件时读一次当种子。
#   会话→出口的亲和表在各自内存里（丢了会自愈重绑）；上游缓存是内容寻址的
#   （实测跨账户 215k 前缀照样 99% 命中），副本切换不伤缓存。
#
# 环境变量：与单副本时代完全一致（ZEN_ADMIN_TOKEN / RESIN_PROXY_TOKEN /
#   ZEN_KEY_01..05），.env 只做 compose 插值、不进容器。
#
# 宿主机回环端口 9000 只留在 zenproxy-a 上（两个副本不能抢绑同一宿主端口）；
#   new-api 走 docker 网络的 zenproxy 名字，两个副本都能到。控制台/预检走
#   a；a 重建期间用 docker exec 进 b 自检。

name: zenproxy

x-zenproxy: &base
  image: zenproxy:latest
  # always 而不是 unless-stopped：出口层是 new-api 的强依赖，宿主重启后必须
  # 自己站起来，不能因为上次是手工 stop 过就一直躺着。
  restart: always
  volumes:
    # 配置只读挂载；容器以 uid/gid 10001 运行，宿主侧权限由 install.sh 对齐。
    - ./config.yaml:/app/config.yaml:ro
    # 唯一可写路径（state.json / exits-state.json），bind mount 便于备份。
    - ./data:/data
  # 故意不写 env_file:.env（上一版踩过的坑：整文件入容器等于白送爆炸半径）。
  # 逐项注入：compose 插值后只传这几项进容器。
  environment:
    ZEN_ADMIN_TOKEN: "${ZEN_ADMIN_TOKEN:?未设置，请填 /opt/zenproxy/.env}"
    RESIN_PROXY_TOKEN: "${RESIN_PROXY_TOKEN:?未设置，请填 /opt/zenproxy/.env}"
    ZEN_KEY_01: "${ZEN_KEY_01:?未设置，请填 /opt/zenproxy/.env}"
    ZEN_KEY_02: "${ZEN_KEY_02:?未设置，请填 /opt/zenproxy/.env}"
    ZEN_KEY_03: "${ZEN_KEY_03:?未设置，请填 /opt/zenproxy/.env}"
    ZEN_KEY_05: "${ZEN_KEY_05:?未设置，请填 /opt/zenproxy/.env}"
  # /healthz 免鉴权存活探测；只说明进程活着，出口健康看 /admin/api/status。
  # 故意不依赖后端，防止出口池临时全挂让容器反复重启。
  healthcheck:
    test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s
  # 请求级日志；限大小防磁盘写满。
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  # ---- 加固：进程本身非 root（uid 10001），这几项只收紧不放松 ----
  security_opt:
    - "no-new-privileges:true"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  networks:
    # new-api 按 http://zenproxy:9000 找到副本；aliases 让两个副本共享这名。
    new-api_default:
      aliases:
        - zenproxy
    # resin 出口池按名字解析；sub2api / CPA 在 llm-internal。
    resin_default:
    llm-internal:

services:
  zenproxy-a:
    <<: *base
    hostname: zenproxy-a
    ports:
      # 只发布到宿主回环（控制台/预检/本机自检）。公网入口是 new-api。
      - "127.0.0.1:9000:9000"

  zenproxy-b:
    <<: *base
    hostname: zenproxy-b
    # 没有宿主端口：两个副本不能抢绑 127.0.0.1:9000；服务走 docker 网络。

networks:
  # external: true = 只加入不创建不改属性。名字由各项目决定，这里写死。
  new-api_default:
    external: true
    name: new-api_default
  resin_default:
    external: true
    name: resin_default
  # 这一条必须写在文件里：docker network connect 手工加的连接不在 compose 的
  # 期望状态里，下次 up 就没了，症状是下游突然连不上 zenproxy。
  llm-internal:
    external: true
    name: llm-internal